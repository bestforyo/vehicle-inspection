databases:
  - name: jianjian-postgres
    databaseName: jianjian
    user: jianjian
    plan: starter

services:
  - type: web
    name: jianjian-api
    runtime: docker
    dockerfilePath: infra/docker/Dockerfile.api
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    preDeployCommand: npm run prisma:deploy
    disk:
      name: jianjian-media
      mountPath: /var/lib/jianjian
      sizeGB: 10
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jianjian-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REPORT_SHARE_HASH_KEY
        generateValue: true
      - key: VEHICLE_DATA_ENCRYPTION_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "false"
      - key: CORS_ORIGINS
        value: https://jianjian-web.onrender.com
      - key: PUBLIC_REPORT_BASE_URL
        value: https://jianjian-web.onrender.com/r
      - key: UPLOAD_DIR
        value: /var/lib/jianjian/uploads
      - key: PORT
        value: "3000"

  - type: web
    name: jianjian-web
    runtime: static
    buildCommand: npm ci && npm run build -w @jianjian/contracts && npm run build -w @jianjian/templates && npm run build -w @jianjian/web
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://jianjian-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
