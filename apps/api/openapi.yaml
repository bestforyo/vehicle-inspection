openapi: 3.0.3
info:
  title: 鉴见车辆检测 API
  version: 1.0.0
  description: 多租户订单、检测版本、审核、正式报告和公开分享接口。
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      security: []
      summary: 账号登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { $ref: '#/components/responses/TokenPair' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/templates:
    get:
      summary: 按标准读取当前机构可用模板
      parameters:
        - in: query
          name: standard
          schema: { type: string, enum: [NATIONAL, GROUP] }
      responses:
        '200': { description: 套餐、章节和项目数量 }
  /api/v1/orders:
    post:
      summary: 幂等创建订单并锁定模板修订
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 已创建订单 }
        '400': { $ref: '#/components/responses/Error' }
    get:
      summary: 当前权限范围内的订单列表
      responses:
        '200': { description: 订单列表 }
  /api/v1/orders/{orderId}/inspection/current:
    get:
      summary: 获取当前检测版本及锁定的模板快照
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: 当前检测版本 }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{orderId}/inspection/draft:
    put:
      summary: 使用乐观锁保存草稿
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: 新版本草稿 }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{orderId}/inspection/submit:
    post:
      summary: 校验并冻结检测版本
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200': { description: 待审核版本 }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{orderId}/reviews/{revisionId}/approve:
    post:
      summary: 管理员审核通过并在事务内生成正式报告
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - in: path
          name: revisionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 正式报告 }
        '403': { $ref: '#/components/responses/Error' }
  /api/v1/orders/{orderId}/reviews/{revisionId}/return:
    post:
      summary: 管理员填写意见退回并创建新草稿修订
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - in: path
          name: revisionId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 已退回 }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/reports/{reportId}/shares:
    post:
      summary: 创建默认30天有效的高熵分享令牌
      parameters:
        - in: path
          name: reportId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: 分享URL；数据库只保存令牌哈希 }
  /public/v1/reports/{token}:
    get:
      security: []
      summary: 无登录读取核准的已发布报告快照
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, minLength: 40 }
      responses:
        '200': { description: 只读公开报告 }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    TokenPair:
      description: 短期访问令牌与轮换刷新令牌
      content:
        application/json:
          schema:
            type: object
            properties:
              accessToken: { type: string }
              refreshToken: { type: string }
              expiresIn: { type: integer }
    Error:
      description: 统一业务错误
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties:
                  code: { type: string }
                  message: { type: string }
                  requestId: { type: string }
                  details: { type: object }
